jenkins:
  securityRealm:
    local:
      users:
        - username: "admin"
          password: "admin"
          fullName: "Admin"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  pluginManager:
    plugins:
      - git:latest
      - github:latest
      - pipeline:latest
      - workflow-aggregator:latest
      - credentials-binding:latest
      - blueocean:latest
      - docker-workflow:latest
      - pipeline-github-lib:latest
      - ssh-agent:latest
      - junit:latest
      - jacoco:latest
      - matrix-auth:latest
      - job-dsl:latest
      - slack:latest
      - workspace-cleanup:latest

  webhook:
    enable: true

  systemMessage: "Jenkins is ready to use"
  jenkinsUrl: "http://localhost:8080"
